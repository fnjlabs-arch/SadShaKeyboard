name: Build debug APK

on:
  push:
    branches: [sadsha-remix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK (all 54 languages)
        run: ./gradlew :ime:app:assembleAllAddOnsDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadsha-keyboard-debug-apk
          path: |
            ime/app/build/outputs/apk/allAddOns/debug/*.apk
            outputs/apk/*.apk
          retention-days: 7
